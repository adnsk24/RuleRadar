version: '3.8'

services:
  ruleradar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruleradar-ai
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
      - USE_GPU=False
      - OFFLINE_MODE=True
    volumes:
      # Maps local data folder (SQLite DB + uploads) into the container for zero data loss
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
