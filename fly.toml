app = "ruleradar-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  DATA_DIR = "/app/data"
  OFFLINE_MODE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "ruleradar_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
